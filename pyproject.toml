[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-backup-core"
version = "0.1.0"
description = "Cross-platform iPhone backup extraction and data normalization library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "iphone-backup-decrypt>=0.11.0",  # 0.11.0 added passphrase_key (iOS 10.0 and 10.1 backups)
    "pytypedstream>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pillow",  # backupgen draws and labels photos
    "tzdata; sys_platform == 'win32'",  # backupgen's persona time zones: Windows has no zoneinfo database
]

[tool.setuptools.packages.find]
where = ["src"]
