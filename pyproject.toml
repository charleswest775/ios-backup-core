[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-backup-core"
version = "0.1.0"
description = "Cross-platform iPhone backup extraction and data normalization library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "iphone-backup-decrypt>=0.5.0",
    "pytypedstream>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pillow"]  # pillow: backupgen draws and labels photos

[tool.setuptools.packages.find]
where = ["src"]
